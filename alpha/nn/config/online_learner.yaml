# nn/online_learner.py config

# ── Model source ────────────────────────────────────────────────────────────
# Initial (generation-0) Hydra run dir — must contain .hydra/config.yaml + *.pth
model_run_dir: /home/egghead/Thesis/Thesis-NN/latest_model/09-44-24/0

# Pre-converted flight log tensor (.pt) for offline test / evaluation.
# Produce with Thesis-NN/data/converter.py from a raw PX4 .ulg log.
flight_log_pt: /home/egghead/Thesis/Thesis-NN/rl_dataset/converted.pt

# ── Output paths ────────────────────────────────────────────────────────────
gen_dir:      /home/egghead/Thesis/output/generations      # per-cycle checkpoints
infer_zarr:   /home/egghead/Thesis/output/infer_log.zarr   # inference thread log
online_zarr:  /home/egghead/Thesis/output/online_data.zarr # vicon-supervised episodes

# Simulation dataset for evaluation (same zarr format as Thesis-NN training data)
sim_dataset_path: /media/egghead/Scratch/joey/simulation_data/patient_one_data.zarr/

# ── Generational schedule ───────────────────────────────────────────────────
p_cycles: 3          # total train-eval-swap cycles
m_train_steps: 1000  # online training samples per cycle (QuickDataset2 training_size)
rollout_steps: 16     # rollout horizon (rollout / gml_rollout modes)
n_eval_traj: 5        # trajectories from sim AND online each (equal split)

# ── Training ────────────────────────────────────────────────────────────────
# standard | rollout | rollout_horz | gml_rollout
# Must be compatible with the loaded checkpoint's out_dim.
# (gml_rollout doubles out_dim — use only if base model was trained that way.)
training_mode: rollout

batch_size: 128
lr: 2e-4
weight_decay: 0.1
seed: 0

# Scheduled sampling ceiling — ramped 0→this via sigmoid over p_cycles
max_schedule_prob: 0.3

# ── Data collection ─────────────────────────────────────────────────────────
episode_len: 1000        # frames per vicon-supervised episode (~10 s at 100 Hz)
collect_hz: 200          # data collection rate (Hz)
min_online_episodes: 5   # cycles block here until this many episodes exist

# ── Inference thread ────────────────────────────────────────────────────────
loop_hz: 200
flush_every: 200

device: cuda
